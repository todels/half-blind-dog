<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choo Choo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wdth,wght@75..100,100..800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffc300;
    --yellow-btn: #ffd000;
    --nav-bg: #eeeeee;
    /* Oscine isn't a web font here; Anek Kannada stands in if it's not installed */
    --font-ui: 'Oscine', 'Anek Kannada', system-ui, sans-serif;
    --font-display: 'Anek Kannada', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { overflow-x: hidden; }

  /* ---------- nav ---------- */
  .nav {
    width: min(940px, calc(100% - 32px)); margin: 16px auto;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px; background: var(--nav-bg); border-radius: 8px;
  }
  .logo {
    display: flex; gap: 1px; padding: 0 12px;
    font: 800 22px/0.9 var(--font-ui); text-transform: uppercase; color: #000;
    text-decoration: none;
  }
  .links { display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .links a {
    display: flex; align-items: center; justify-content: center;
    padding: 12px 16px; background: #fff; border-radius: 8px;
    font: 800 14px/0.9 var(--font-ui); text-transform: uppercase; color: #000; text-decoration: none;
  }
  .links a:hover { background: #f6f6f6; }

  /* every text box is trimmed from cap height to baseline */
  .t, .headline { display: block; text-box: trim-both cap alphabetic; }
  .buy-small { width: 139px; flex: none; background: #000; border-radius: 8px; text-decoration: none; }
  .buy-small > span {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 16px; background: var(--yellow-btn);
    border: 2px solid #000; border-radius: 16px;
    font: 800 14px/0.9 var(--font-ui); text-transform: uppercase; color: #000; white-space: nowrap;
  }
  .buy-small img { width: 24px; height: 24px; }

  /* ---------- hero ----------
     Desktop keeps the 1408 x 777 Figma composition. --u is one Figma pixel,
     sized so the whole composition fits the hero's width and height. */
  .hero {
    position: relative; margin: 0 16px 16px;
    height: max(520px, min(calc((100vw - 32px) * 777 / 1408), calc(100svh - 108px)));
    background: var(--yellow); border-radius: 16px; overflow: clip;
    container-type: size;
  }
  .hero > * {
    position: absolute;
    --u: min(calc(100cqw / 1408), calc(100cqh / 777));
    /* black shape box, shared by the shape and the dark ticker's mask */
    --bx: calc(-15 * var(--u)); --by: calc(-39 * var(--u));
    --bw: calc(787 * var(--u)); --bh: calc(849 * var(--u));
    /* ticker */
    --tw: calc(1530 * var(--u)); --th: calc(485 * var(--u));
    --tgap: calc(120 * var(--u)); --ttop: calc(-11 * var(--u));
  }
  .black-shape { left: var(--bx); top: var(--by); width: var(--bw); height: var(--bh); }

  /* $CHOO ticker: one track over the yellow, a dimmer copy clipped to the black shape */
  .ticker { inset: 0; pointer-events: none; }
  .ticker.dark {
    -webkit-mask: url(assets/vector17.svg) var(--bx) var(--by) / var(--bw) var(--bh) no-repeat;
            mask: url(assets/vector17.svg) var(--bx) var(--by) / var(--bw) var(--bh) no-repeat;
  }
  .ticker-track {
    position: absolute; top: var(--ttop); left: calc(50% - var(--tw) / 2);
    display: flex; gap: var(--tgap); width: max-content;
    animation: ticker 16s linear infinite reverse;
  }
  .ticker-track img { width: var(--tw); height: var(--th); flex: none; }
  .ticker.light img { opacity: 0.45; }
  .ticker.dark img { opacity: 0.18; }
  @keyframes ticker { to { transform: translateX(calc(-1 * (var(--tw) + var(--tgap)))); } }
  @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }

  .headline {
    top: calc(498 * var(--u)); margin: 0;
    font-family: var(--font-display); font-weight: 800;
    font-size: calc(96 * var(--u)); line-height: calc(80 * var(--u));
    font-variation-settings: "wdth" 90; font-stretch: 90%;
    text-transform: uppercase;
  }
  .headline.left { left: calc(24 * var(--u)); width: calc(439 * var(--u)); color: #fff; }
  .headline.right { right: calc(16 * var(--u)); width: calc(296 * var(--u)); color: #000; }

  .dog {
    --size: calc(837 * var(--u));
    left: calc(50% + var(--u)); top: 0; width: var(--size); height: var(--size); transform: translateX(-50%);
  }
  .dog .eye { transform-box: fill-box; transform-origin: center; }

  .buy-big {
    right: calc(16 * var(--u)); top: calc(663 * var(--u)); width: calc(293 * var(--u));
    padding: max(3px, calc(4 * var(--u))); background: #000; border-radius: 8px; text-decoration: none;
  }
  .buy-big > span {
    display: flex; align-items: center; justify-content: center;
    padding: calc(32 * var(--u)) calc(48 * var(--u)); background: #fff; border-radius: calc(32 * var(--u));
    font-family: var(--font-display); font-weight: 800; font-size: calc(40 * var(--u)); line-height: 0.9;
    font-variation-settings: "wdth" 90; font-stretch: 90%;
    text-transform: uppercase; color: #000; white-space: nowrap;
    transition: transform 0.15s ease;
  }
  .buy-big:hover > span { transform: scale(0.98); }

  .socials {
    --size: calc(72 * var(--u));
    left: calc(24 * var(--u)); top: calc(689 * var(--u));
    display: flex; gap: calc(8 * var(--u)); margin: 0; padding: 0; list-style: none;
  }
  .socials a {
    display: flex; align-items: center; justify-content: center;
    width: var(--size); height: var(--size); border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.22);
    transition: border-color 0.15s ease;
  }
  .socials a:hover { border-color: rgba(255, 255, 255, 0.5); }
  .socials img { width: 44%; height: 44%; }

  /* ---------- small screens: stacked composition, --u is one pixel of a 358-wide hero ---------- */
  @media (max-width: 759px) {
    .links { display: none; }
    .logo { padding: 0 8px; }
    .hero { height: clamp(600px, calc(100svh - 108px), 880px); }
    .hero > * {
      --u: calc(100cqw / 358);
      --bx: -6cqw; --by: -4cqh; --bw: 76cqw; --bh: 108cqh;
      --tw: calc(700 * var(--u)); --th: calc(222 * var(--u));
      --tgap: calc(56 * var(--u)); --ttop: calc(150 * var(--u));
    }
    .headline { top: calc(28 * var(--u)); font-size: calc(40 * var(--u)); line-height: calc(35 * var(--u)); }
    .headline.left { left: calc(16 * var(--u)); width: calc(200 * var(--u)); }
    .headline.right { right: calc(16 * var(--u)); width: calc(110 * var(--u)); text-align: right; }
    .socials { --size: calc(48 * var(--u)); left: calc(16 * var(--u)); top: calc(128 * var(--u)); }
    .dog {
      --size: min(130cqw, 78cqh);
      left: 50%; top: auto; bottom: calc(var(--size) * -0.08);
    }
    .buy-big { left: calc(12 * var(--u)); right: calc(12 * var(--u)); top: auto; bottom: calc(12 * var(--u)); width: auto; }
    .buy-big > span { padding: calc(24 * var(--u)); font-size: calc(30 * var(--u)); border-radius: calc(24 * var(--u)); }
  }
</style>
</head>
<body>
